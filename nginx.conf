server {
    listen 80;
    server_name _;

    root /www/pkrisztian;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml;

    # basic security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # hashed build output never changes, so it can be cached forever
    location /assets/ {
        expires max;
        try_files $uri =404;
    }

    # index.html must always be revalidated, otherwise visitors keep an old version after a deploy
    location = /index.html {
        expires -1;
    }

    # everything else in public/ (favicons, manifest, etc.)
    location / {
        expires 7d;
        try_files $uri /index.html;
    }
}
