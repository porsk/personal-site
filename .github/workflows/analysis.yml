name: Analysis CI

on: push

jobs:
    lint-and-build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm

            - name: Install Node modules
              run: npm ci

            - name: Run ESLint
              run: npm run lint

            - name: Check formatting
              run: npx prettier --check .

            - name: Type-check and build
              run: npm run build
