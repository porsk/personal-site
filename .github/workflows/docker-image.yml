name: Docker Image CI

on:
    push:
        branches: [develop, main]
    pull_request:
        branches: [develop, main]

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            # Only log in when we are going to push (not on pull requests)
            - name: Login to Docker Hub
              if: github.event_name == 'push'
              uses: docker/login-action@v4
              with:
                  username: ${{ secrets.DOCKER_HUB_USERNAME }}
                  password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

            # Pull requests only build the image to check it works.
            # Pushes to develop/main build and publish it.
            - name: Build (and push on merge)
              uses: docker/build-push-action@v7
              with:
                  context: .
                  push: ${{ github.event_name == 'push' }}
                  tags: |
                      ${{ secrets.DOCKER_HUB_USERNAME }}/pkrisztian:latest
                      ${{ secrets.DOCKER_HUB_USERNAME }}/pkrisztian:${{ github.sha }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
